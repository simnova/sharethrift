union User = PersonalUser

type PaginatedUsers {
	items: [User!]!
	total: Int!
	page: Int!
	pageSize: Int!
}

extend type Query {
	# Unified end-user query - excludes admin users
	currentUser: User!

	# Entry-point query - returns current authenticated end user, auto-creating PersonalUser if first login
	currentUserAndCreateIfNotExists: User!
}
