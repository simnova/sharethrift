type AdminUser implements MongoBase {
	id: ObjectID!
	userType: String
	isBlocked: Boolean
	account: AdminUserAccount
	role: AdminRole
	schemaVersion: String
	createdAt: DateTime
	updatedAt: DateTime
	userIsAdmin: Boolean
}

type AdminUserAccount {
	accountType: String
	email: String
	username: String
	profile: AdminUserAccountProfile
}

type AdminUserAccountProfile {
	firstName: String
	lastName: String
	aboutMe: String
	location: AdminUserAccountProfileLocation
}

type AdminUserAccountProfileLocation {
	address1: String
	address2: String
	city: String
	state: String
	country: String
	zipCode: String
}

input AdminUserCreateInput {
	email: String!
	username: String!
	firstName: String!
	lastName: String!
	roleId: ObjectID!
}

input AdminUserUpdateInput {
	id: ObjectID!
	isBlocked: Boolean
	roleId: ObjectID
	account: AdminUserAccountUpdateInput
}

input AdminUserAccountUpdateInput {
	accountType: String
	username: String
	profile: AdminUserAccountProfileUpdateInput
}

input AdminUserAccountProfileUpdateInput {
	firstName: String
	lastName: String
	aboutMe: String
	location: AdminUserAccountProfileLocationUpdateInput
}

input AdminUserAccountProfileLocationUpdateInput {
	address1: String
	address2: String
	city: String
	state: String
	country: String
	zipCode: String
}

type AdminUserMutationResult implements MutationResult {
	status: MutationStatus!
	adminUser: AdminUser
}

extend type Query {
	# Admin User queries
	currentAdminUser: AdminUser!
	adminDashboardUsers(
		page: Int!
		pageSize: Int!
		searchText: String
		statusFilters: [String!]
		sorter: SorterInput
	): PaginatedUsers!
}

extend type Mutation {
	# Admin User mutations
	createAdminUser(input: AdminUserCreateInput!): AdminUserMutationResult!
	adminUserUpdate(input: AdminUserUpdateInput!): AdminUserMutationResult!

	# # Uncomment when admin blocking is needed
	# blockAdminUser(userId: ObjectID!): AdminUserMutationResult!
	# unblockAdminUser(userId: ObjectID!): AdminUserMutationResult!
}
